name: Update Coverage Badge

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  update-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run tests with coverage
        run: npm run test:coverage 2>&1 | tee coverage-output.txt
      
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(grep -E "All files" coverage-output.txt | awk '{print $3}' | sed 's/%//' | head -1)
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0"
          fi
          # Round to nearest integer
          COVERAGE_INT=$(printf "%.0f" "$COVERAGE")
          echo "coverage=$COVERAGE_INT" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE_INT%"
      
      - name: Update README badge
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            
            // Determine badge color based on coverage
            let color = 'red';
            if (coverage >= 80) {
              color = 'brightgreen';
            } else if (coverage >= 60) {
              color = 'green';
            } else if (coverage >= 40) {
              color = 'yellow';
            } else if (coverage >= 20) {
              color = 'orange';
            }
            
            // Read README
            let readme = fs.readFileSync('README.md', 'utf8');
            
            // Update coverage badge
            const badgeRegex = /\[!\[Coverage\]\(https:\/\/img\.shields\.io\/badge\/coverage-\d+%25-[a-z]+\)\]/;
            const newBadge = `[![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})](https://github.com/koniz-dev/canvaslens)`;
            
            if (badgeRegex.test(readme)) {
              readme = readme.replace(badgeRegex, newBadge);
            } else {
              // If badge doesn't exist, add it after Tests badge
              readme = readme.replace(
                /(\[!\[Tests\].*?\n)/,
                `$1[![Coverage](https://img.shields.io/badge/coverage-${coverage}%25-${color})](https://github.com/koniz-dev/canvaslens)\n`
              );
            }
            
            // Write back
            fs.writeFileSync('README.md', readme);
            
            // Commit if changed
            const { execSync } = require('child_process');
            try {
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync('git add README.md');
              execSync('git diff --staged --quiet || git commit -m "chore: update coverage badge to ' + coverage + '%"');
              execSync('git push');
            } catch (error) {
              console.log('No changes to commit or push failed:', error.message);
            }

